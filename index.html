<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcolo lievito</title>
  <link rel="stylesheet" href="style.css">
  <!-- applica subito il tema scelto, prima che la pagina compaia -->
  <script>try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<main>
  <header>
    <div class="testata">
      <h1 data-t="titoloPagina">Calcolo lievito</h1>
      <div class="comandi">
        <select id="lingua" data-t-aria="lingua" aria-label="Lingua">
          <option value="it">Italiano</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
        </select>
        <button type="button" id="tema" aria-label="Tema scuro">☾</button>
      </div>
    </div>
    <p class="nota" data-t="sottotitolo">Farina, acqua, sale e lievito per il tuo impasto. Valori indicativi.</p>
  </header>

  <form id="dati" autocomplete="off">
    <fieldset>
      <legend data-t="panetti">Panetti</legend>
      <label><span data-t="peso">Peso di un panetto</span> <span><input name="peso" value="250" inputmode="decimal" data-check="positivo"> g</span></label>
      <label><span data-t="numero">Numero di panetti</span> <span><input name="panetti" value="1" inputmode="numeric" data-check="intero"></span></label>
    </fieldset>

    <fieldset>
      <legend data-t="impasto">Impasto</legend>
      <label><span data-t="idratazione">Idratazione</span> <span><input name="idratazione" value="65" inputmode="decimal" data-check="nonNegativo"> %</span></label>
      <label><span data-t="sale">Sale</span>
        <span>
          <input name="sale" value="50" inputmode="decimal" data-check="nonNegativo">
          <select name="unitaSale" data-t-aria="unitaSale" aria-label="Unità del sale">
            <option value="gl" data-t="gl">g/L acqua</option>
            <option value="pct" data-t="pctFarina">% farina</option>
          </select>
        </span>
      </label>
      <label><span data-t="olio">Olio / grassi</span> <span><input name="olio" value="0" inputmode="decimal" data-check="nonNegativo"> %</span></label>
      <label><span data-t="zucchero">Zucchero</span> <span><input name="zucchero" value="0" inputmode="decimal" data-check="nonNegativo"> %</span></label>
    </fieldset>

    <fieldset>
      <legend data-t="lievitazione">Lievitazione</legend>
      <label><span data-t="ore">Ore di lievitazione</span> <span><input name="ore" value="8" inputmode="decimal" data-check="positivo"> h</span></label>
      <label><span data-t="temp">Temperatura (10–35 °C)</span> <span><input name="temp" value="22" inputmode="decimal" data-check="temperatura"> °C</span></label>
    </fieldset>

    <fieldset>
      <legend data-t="lievito">Lievito</legend>
      <label><span data-t="tipo">Tipo</span>
        <select name="tipo">
          <option value="fresco" data-t="fresco">Lievito di birra fresco</option>
          <option value="secco" data-t="secco">Lievito di birra secco istantaneo</option>
          <option value="madre" data-t="madre">Lievito madre</option>
        </select>
      </label>
      <div id="madre" hidden>
        <label><span data-t="madre">Lievito madre</span> <span><input name="percentualeMadre" value="25" inputmode="decimal" data-check="positivo"> <span data-t="pctFarina">% farina</span></span></label>
        <label><span data-t="idratazioneMadre">Idratazione del madre</span> <span><input name="idratazioneMadre" value="50" inputmode="decimal" data-check="nonNegativo"> %</span></label>
      </div>
    </fieldset>
  </form>

  <section id="risultato" aria-live="polite">
    <h2 data-t="ricetta">La tua ricetta</h2>
    <p id="titolo" class="sottotitolo"></p>
    <table><tbody id="righe"></tbody></table>
    <p id="dettagli" class="nota"></p>
  </section>
</main>

<!-- solo su telefono: le quantità principali sempre a vista, tocca per andare alla ricetta -->
<button type="button" id="barra" data-t-aria="vaiRicetta" aria-label="Vai alla ricetta"></button>

<script src="calc.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
