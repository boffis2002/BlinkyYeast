<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricette</title>
  <link rel="stylesheet" href="style.css">
  <!-- applica subito il tema scelto, prima che la pagina compaia -->
  <script>try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body data-titolo="titoloRicette">
<header class="testata">
  <nav class="navbar" data-t-aria="navigazione" aria-label="Navigazione">
    <div class="contenitore barra-nav">
      <div class="pagine">
        <a class="pagina" href="./" data-t="calcolatore">Calcolatore</a>
        <a class="pagina" href="ricette.html" aria-current="page" data-t="ricette">Ricette</a>
      </div>
      <div class="comandi">
        <select id="lingua" data-t-aria="lingua" aria-label="Lingua">
          <option value="it">IT</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="es">ES</option>
          <option value="de">DE</option>
        </select>
        <button type="button" id="tema" aria-label="Tema scuro">☾</button>
      </div>
    </div>
  </nav>
</header>

<main class="contenitore">
  <h1 data-t="titoloRicette">Ricette</h1>
  <p class="nota" data-t="sottotitoloRicette">Ricette tratte dai disciplinari ufficiali di prodotti DOP e STG.</p>

  <div class="ricerca">
    <input type="search" id="cerca" autocomplete="off" data-t-placeholder="cerca" data-t-aria="cerca"
           placeholder="Cerca per nome o ingrediente" aria-label="Cerca per nome o ingrediente">
    <div id="categorie" class="categorie" role="group" data-t-aria="categoria" aria-label="Categoria"></div>
  </div>

  <div id="elenco" class="elenco" aria-live="polite"></div>
  <p id="nessuna" class="nota" data-t="nessunaRicetta" hidden>Nessuna ricetta corrisponde alla ricerca.</p>
</main>

<script src="i18n.js"></script>
<script src="ricette.js"></script>
<script src="comune.js"></script>
<script src="pagina-ricette.js"></script>
</body>
</html>
